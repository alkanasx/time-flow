<!DOCTYPE html>//告诉浏览器这是一个html5文档
<html lang="zh">//根标签+页面内容是中文
<head>//头部放配置信息
    <meta charset="UTF-8">//字符编码保证不乱码
    <title>My TimeFlow</title>//浏览器上的标题
    <style>/*css样式*/
        * {
            margin: 0;//外边距
            padding: 0;//内边距
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;//字体：无衬线体
            background: white;//背景：白色
            padding: 20px;//页面四周留20px的空隙
        }

        .container {//容器样式
            max-width: 600px;//最宽600px
            margin: 0 auto;//自动居中
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .input-row button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .task {
            background: white;
            padding: 15px;
            margin-bottom: 10px;//卡片之间间距10px
            border-radius: 6px;//圆角6px
            display: flex;//弹性布局
            align-items: center;//子元素垂直居中
            gap: 10px;//子元素间距10px
        }


        .task.completed {
            opacity: 0.5;//已完成的任务半透明
        }

        .task .title {
            flex: 1;//标题占满剩余空间
        }

        .task.completed .title {
            text-decoration: line-through;//已完成的任务加删除线
        }

        .task button {//按钮通用样式
            padding: 6px 12px;
            border: none;//去掉默认边框
            border-radius: 4px;//圆角
            cursor: pointer;//鼠标放上去变成手型
        }

        .btn-done {//完成按钮蓝色
            background: #2196F3;
            color: white;
        }

        .btn-delete {//删除按钮红色
            background: #f44336;
            color: white;
        }

        .input-row input[type="datetime-local"] {
            flex: 0 0 auto;
            width: 200px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .task .time-range {
            color: #666;
            font-size: 14px;
        }

        .task .details {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #666;
        }

        .task.expanded .details {
            display: block;
        }

        .task .details div {
            margin-bottom: 5px;
        }

    </style>
</head>

<body>//页面主体
<div class="container">//一个容器+在css里控制样式

    <h1>TimeFlow</h1>//一级标题

    <div class="input-row">//输入区域，里面有输入框和按钮
        <input type="text" id="titleInput" placeholder=" ">//文本输入框+Javascrip唯一标识+输入框未空时显示的提示词
        <input type="datetime-local" id="plannedAtInput" title="计划开始时间">//浏览器自带时间+唯一标识+鼠标悬停时提示词
        <input type="datetime-local" id="plannedEndInput" title="预计结束时间">
        <button onclick="addTask()">添加</button>//按钮，点击时执行addTask函数
    </div>

    <div id="taskList"></div>
</div>

<script>
    // 页面加载时获取所有任务，一打开就调用loadTasks
    //javascript从上往下执行
    loadTasks();

    function loadTasks() {
        fetch('/api/tasks')//发送get请求到/api/tasks
            .then(res => res.json())//把后端返回的json转成javascirpt
            .then(tasks => {//拿到任务数组后开始处理
                // 按计划时间排序，没时间的排最后
                tasks.sort((a, b) => {
                    if (!a.plannedAt) return 1;
                    if (!b.plannedAt) return -1;
                    return new Date(a.plannedAt) - new Date(b.plannedAt);
                });

                let html = '';//准备空字符串，连接html

                for (let task of tasks) {
                    let doneClass = task.completed ? 'completed' : '';//任务完成类名显示completed，对应completed的代码或者为空
                    let doneText = task.completed ? '撤销' : '完成';

                    let timeRange = '';
                    if (task.plannedAt) {
                        let start = task.plannedAt.substring(11, 16);// 只显示时:分
                        if (task.plannedEnd) {
                            let end = task.plannedEnd.substring(11, 16);
                            timeRange = `<span class="time-range">${start} - ${end}</span>`;
                        } else {
                            timeRange = `<span class="time-range">${start}</span>`;
                        }
                    }

                    // 详细信息
                    let detailsHtml = '';
                    if (task.plannedAt) {
                        detailsHtml += `<div>开始时间：${task.plannedAt}</div>`;
                    }
                    if (task.plannedEnd) {
                        detailsHtml += `<div>结束时间：${task.plannedEnd}</div>`;
                    }
                    if (task.description) {
                        detailsHtml += `<div>备注：${task.description}</div>`;
                    }

                    html += `
                    <div class="task ${doneClass}">
                        <div style="flex:1;cursor:pointer;" onclick="toggleExpand(${task.id})">
                            <span class="title">${task.title}</span>
                            ${timeRange}
                            <div class="details" id="details-${task.id}">
                                ${detailsHtml}
                            </div>
                        </div>
                        <button class="btn-done" onclick="toggleTask(${task.id}, ${task.completed})">${doneText}</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">删除</button>
                    </div>
                `;
                }
                document.getElementById('taskList').innerHTML = html;
            });
    }

    function addTask() {
        let title = document.getElementById('titleInput').value;
        if (!title) return;

        let plannedAt = document.getElementById('plannedAtInput').value;
        let plannedEnd = document.getElementById('plannedEndInput').value;
        let data = {title: title};
        if (plannedAt) {
            data.plannedAt = plannedAt;
        }
        if (plannedEnd) {
            data.plannedEnd = plannedEnd;
        }

        fetch('/api/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(() => {
            document.getElementById('titleInput').value = '';
            document.getElementById('plannedAtInput').value = '';
            document.getElementById('plannedEndInput').value = '';
            loadTasks();
        });
    }

    function toggleTask(id, completed) {
        fetch(`/api/tasks/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({completed: !completed})
        }).then(() => loadTasks());
    }

    function deleteTask(id) {
        fetch(`/api/tasks/${id}`, {
            method: 'DELETE'
        }).then(() => loadTasks());
    }

    function toggleExpand(id) {
        let details = document.getElementById('details-' + id);
        if (details.style.display === 'block') {
            details.style.display = 'none';
        } else {
            details.style.display = 'block';
        }
    }
</script>
</body>
</html>
