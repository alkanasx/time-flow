<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>My TimeFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background: white;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .input-row button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .task {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .task.completed {
            opacity: 0.5;
        }

        .task .title {
            flex: 1;
        }

        .task.completed .title {
            text-decoration: line-through;
        }

        .task button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-done {
            background: #2196F3;
            color: white;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .input-row input[type="datetime-local"] {
            flex: 0 0 auto;
            width: 200px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .task .time-range {
            color: #666;
            font-size: 14px;
        }

        .task .details {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #666;
        }

        .task.expanded .details {
            display: block;
        }

        .task .details div {
            margin-bottom: 5px;
        }

    </style>
</head>

<body>//页面主体
<div class="container">//一个容器+在css里控制样式

    <h1>TimeFlow</h1>//一级标题

    <div class="input-row">//输入区域，里面有输入框和按钮
        <input type="text" id="titleInput" placeholder=" ">//文本输入框+Javascrip唯一标识+输入框未空时显示的提示词
        <input type="datetime-local" id="plannedAtInput" title="计划开始时间">//浏览器自带时间+唯一标识+鼠标悬停时提示词
        <input type="datetime-local" id="plannedEndInput" title="预计结束时间">
        <button onclick="addTask()">添加</button>//按钮，点击时执行addTask函数
    </div>

    <div id="taskList"></div>
</div>

<script>
    loadTasks();

    function loadTasks() {
        fetch('/api/tasks')
            .then(res => res.json())
            .then(tasks => {
                tasks.sort((a, b) => {
                    if (!a.plannedAt) return 1;
                    if (!b.plannedAt) return -1;
                    return new Date(a.plannedAt) - new Date(b.plannedAt);
                });

                let html = '';

                for (let task of tasks) {
                    let doneClass = task.completed ? 'completed' : '';
                    let doneText = task.completed ? '撤销' : '完成';

                    let timeRange = '';
                    if (task.plannedAt) {
                        let start = task.plannedAt.substring(11, 16);
                        if (task.plannedEnd) {
                            let end = task.plannedEnd.substring(11, 16);
                            timeRange = `<span class="time-range">${start} - ${end}</span>`;
                        } else {
                            timeRange = `<span class="time-range">${start}</span>`;
                        }
                    }


                    let detailsHtml = '';
                    if (task.plannedAt) {
                        detailsHtml += `<div>开始时间：${task.plannedAt}</div>`;
                    }
                    if (task.plannedEnd) {
                        detailsHtml += `<div>结束时间：${task.plannedEnd}</div>`;
                    }
                    if (task.description) {
                        detailsHtml += `<div>备注：${task.description}</div>`;
                    }

                    html += `
                    <div class="task ${doneClass}">
                        <div style="flex:1;cursor:pointer;" onclick="toggleExpand(${task.id})">
                            <span class="title">${task.title}</span>
                            ${timeRange}
                            <div class="details" id="details-${task.id}">
                                ${detailsHtml}
                            </div>
                        </div>
                        <button class="btn-done" onclick="toggleTask(${task.id}, ${task.completed})">${doneText}</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">删除</button>
                    </div>
                `;
                }
                document.getElementById('taskList').innerHTML = html;
            });
    }

    function addTask() {
        let title = document.getElementById('titleInput').value;
        if (!title) return;

        let plannedAt = document.getElementById('plannedAtInput').value;
        let plannedEnd = document.getElementById('plannedEndInput').value;
        let data = {title: title};
        if (plannedAt) {
            data.plannedAt = plannedAt;
        }
        if (plannedEnd) {
            data.plannedEnd = plannedEnd;
        }

        fetch('/api/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(() => {
            document.getElementById('titleInput').value = '';
            document.getElementById('plannedAtInput').value = '';
            document.getElementById('plannedEndInput').value = '';
            loadTasks();
        });
    }

    function toggleTask(id, completed) {
        fetch(`/api/tasks/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({completed: !completed})
        }).then(() => loadTasks());
    }

    function deleteTask(id) {
        fetch(`/api/tasks/${id}`, {
            method: 'DELETE'
        }).then(() => loadTasks());
    }

    function toggleExpand(id) {
        let details = document.getElementById('details-' + id);
        if (details.style.display === 'block') {
            details.style.display = 'none';
        } else {
            details.style.display = 'block';
        }
    }
</script>
</body>
</html>
